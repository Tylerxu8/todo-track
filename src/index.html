<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>To-do</title>
	<link rel="stylesheet" href="styles.css">
	<script src="app.js" defer></script>
</head>
<body>
	<h1>To-do Task List</h1>
	<form id="new-task">

		<input type="text" id="task-input" name="task" autocomplete="off">
		<button type="submit">Add</button>
	</form>
<ul id="list">
	<p id="counter"></p>
</ul>	
</body>	
</html>
